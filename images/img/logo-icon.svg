<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%">
  <defs>
    <linearGradient id="nallayilIconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087A24"/>
      <stop offset="35%" stop-color="#229E1B"/>
      <stop offset="70%" stop-color="#45B51B"/>
      <stop offset="100%" stop-color="#68C62A"/>
    </linearGradient>
    <linearGradient id="nallayilFigureIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07631D"/>
      <stop offset="100%" stop-color="#087A24"/>
    </linearGradient>
    <linearGradient id="veinIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065418"/>
      <stop offset="100%" stop-color="#0A6E20"/>
    </linearGradient>
  </defs>

  <g transform="translate(-80, -60)">
    <!-- Pedestal Base Under Leaf Bowl -->
    <ellipse cx="242" cy="276" rx="72" ry="11" fill="#054414" />

    <!-- Head -->
    <circle cx="152" cy="96" r="23" fill="url(#nallayilFigureIconGrad)" />

    <!-- Torso -->
    <path d="M 148 122 C 162 138, 180 152, 210 165 L 228 152 C 192 138, 168 124, 148 122 Z" fill="url(#nallayilFigureIconGrad)" />

    <!-- Arm reclining -->
    <path d="M 144 134 C 130 154, 122 176, 125 192 L 178 194 C 180 180, 175 162, 166 148 L 144 134 Z" fill="url(#nallayilFigureIconGrad)" />

    <!-- Horizontal reaching arm -->
    <path d="M 205 125 L 282 122 C 272 128, 240 134, 205 129 Z" fill="#087A24" />

    <!-- The Sacred Healing Leaf Vessel / Bowl -->
    <path d="M 126 192 C 134 246, 178 280, 252 278 C 318 276, 355 238, 372 174 C 342 208, 288 234, 224 222 C 168 212, 138 196, 126 192 Z" fill="url(#nallayilIconGrad)" />

    <!-- Main Leaf Body Fill -->
    <path d="M 126 192 C 135 220, 162 268, 244 270 C 314 272, 350 228, 372 174 C 342 132, 260 126, 196 156 C 162 174, 142 186, 126 192 Z" fill="url(#nallayilIconGrad)" />

    <!-- Stem Tip -->
    <path d="M 368 176 L 382 158 C 378 168, 370 174, 364 178 Z" fill="#087A24" stroke="#065418" stroke-width="1.5" />

    <!-- Leaf Veins -->
    <path d="M 372 174 C 318 222, 246 244, 198 238" stroke="url(#veinIconGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 265 232 C 250 216, 238 208, 218 206" stroke="url(#veinIconGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 292 216 C 272 198, 256 188, 236 184" stroke="url(#veinIconGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 316 200 C 298 186, 285 176, 270 170" stroke="url(#veinIconGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 280 242 C 265 256, 246 264, 228 268" stroke="url(#veinIconGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>
</svg>